<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>BetInsight – Sicherer Übergang</title>
  <style>
    html,body{min-height:100%;margin:0}body{display:grid;place-items:center;background:#03131d;color:#dff6ff;font-family:Inter,Arial,sans-serif}.card{width:min(520px,calc(100% - 32px));padding:26px;border:1px solid rgba(104,203,235,.2);border-radius:20px;background:#062433;box-shadow:0 24px 70px rgba(0,0,0,.34);text-align:center}.dot{width:12px;height:12px;margin:0 auto 14px;border-radius:50%;background:#18d294;box-shadow:0 0 18px rgba(24,210,148,.8)}h1{margin:0 0 8px;font-size:22px}p{margin:0;color:#96b8c6;line-height:1.55;font-size:13px}.error{color:#ffd1d5}.back{display:none;margin:18px auto 0;padding:11px 15px;border-radius:11px;background:#168df2;color:#fff;text-decoration:none;font-weight:800;font-size:13px}.back.show{display:inline-flex}
  </style>
</head>
<body>
  <main class="card">
    <div class="dot"></div>
    <h1>Sicherer Übergang</h1>
    <p id="status">Premium &amp; Network wird sicher geöffnet …</p>
    <a id="back" class="back" href="https://app.betinsight.club/">Zurück zum BetInsight Dashboard</a>
  </main>
<script>
(async () => {
  "use strict";

  const REDEEM_URL = "https://hook.eu1.make.com/qf4wr3r75cru5io9pdxd3823hbbulm48";
  const SESSION_KEY = "betinsight_network_session_token";
  const PREMIUM_URL = "../premium/";
  const status = document.getElementById("status");
  const back = document.getElementById("back");
  const isUuid = value => /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value||"").trim());

  function fail(text){
    status.classList.add("error");
    status.textContent=text;
    back.classList.add("show");
  }

  let existing="";
  try{existing=String(sessionStorage.getItem(SESSION_KEY)||"").trim()}catch(e){}

  const params=new URLSearchParams(location.search);
  const code=String(params.get("code")||"").trim();

  /* The short-lived code is removed from the visible address immediately. */
  if(location.search){
    try{history.replaceState({},document.title,location.pathname)}catch(e){}
  }

  if(!code){
    if(isUuid(existing)){
      location.replace(PREMIUM_URL);
      return;
    }
    fail("Der sichere Zugangscode fehlt. Bitte kehre zum BetInsight Dashboard zurück und öffne Premium-Provisionen erneut.");
    return;
  }

  status.textContent="Sicherer Einmalzugang wird geprüft …";

  try{
    const redeem=new URL(REDEEM_URL);
    redeem.searchParams.set("code",code);
    const response=await fetch(redeem.toString(),{
      method:"GET",
      cache:"no-store",
      credentials:"omit",
      referrerPolicy:"no-referrer"
    });
    let data=null;
    try{data=await response.json()}catch(e){}
    const token=String(data?.dashboard_token||"").trim();
    if(!response.ok||data?.success!==true||!isUuid(token))throw new Error("redeem_failed");

    sessionStorage.setItem(SESSION_KEY,token);
    status.classList.remove("error");
    status.textContent="✅ Zugang bestätigt. Premium & Network wird geöffnet …";
    window.setTimeout(()=>location.replace(PREMIUM_URL),120);
  }catch(e){
    try{sessionStorage.removeItem(SESSION_KEY)}catch(_){}
    fail("Der sichere Einmalzugang ist ungültig, bereits verwendet oder abgelaufen. Bitte kehre zum Dashboard zurück und öffne Premium-Provisionen erneut.");
  }
})();
</script>
</body>
</html>
